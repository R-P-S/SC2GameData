name: Update SC2 and Heroes Game Data
on:
  schedule:
    - cron: '17 14 * * 1-5'
      timezone: 'America/Denver'
  workflow_dispatch:
    inputs:
      game:
        description: "Which game to check"
        type: choice
        options: [both, sc2, heroes]
        default: both
      dry_run:
        description: "Extract and verify without changing repository files"
        type: boolean
        default: false
      force:
        description: "Re-extract even if the build ID matches"
        type: boolean
        default: false
      historical:
        description: "Recover missed patches in chronological order"
        type: boolean
        default: true

permissions:
  contents: write
concurrency:
  group: sc2-and-heroes-gamedata-update
  cancel-in-progress: false
jobs:
  fetch:
    if: github.repository == 'R-P-S/SC2GameData' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      SC2_DRY_RUN: "${{ inputs.dry_run || 'false' }}"
      SC2_FORCE: "${{ inputs.force || 'false' }}"
      HOTS_DRY_RUN: "${{ inputs.dry_run || 'false' }}"
      HOTS_FORCE: "${{ inputs.force || 'false' }}"
    steps:
      - name: Checkout this fork
        uses: actions/checkout@v4
        with:
          repository: R-P-S/SC2GameData
          ref: master
          persist-credentials: true
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install CASC reader
        run: npm install --no-save --no-package-lock --no-audit --no-fund @jamiephan/casclib@0.3.0
      - name: Configure Git and safe fork remote
        run: |
          git config user.name "R-P-S GameData Bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://github.com/R-P-S/SC2GameData.git"

      - name: Recover historical SC2 builds
        if: inputs.game != 'heroes' && (github.event_name == 'schedule' || inputs.historical != false)
        run: |
          EXTRA=""
          if [[ "$SC2_DRY_RUN" == "true" ]]; then EXTRA="--dry-run"; fi
          if [[ "$SC2_FORCE" == "true" ]]; then EXTRA="$EXTRA --force"; fi
          python3 scripts/catch_up_history.py --game sc2 --max-builds 3 --history-scan 300 $EXTRA

      - name: Recover historical Heroes builds
        if: inputs.game != 'sc2' && (github.event_name == 'schedule' || inputs.historical != false)
        run: |
          EXTRA=""
          if [[ "$HOTS_DRY_RUN" == "true" ]]; then EXTRA="--dry-run"; fi
          if [[ "$HOTS_FORCE" == "true" ]]; then EXTRA="$EXTRA --force"; fi
          python3 scripts/catch_up_history.py --game heroes --max-builds 3 --history-scan 300 $EXTRA

      - name: Check latest SC2 only (historical recovery disabled)
        if: inputs.game != 'heroes' && github.event_name == 'workflow_dispatch' && inputs.historical == false
        id: sc2_latest
        run: node scripts/update_sc2_gamedata.js

      - name: Commit latest-only SC2 version
        if: steps.sc2_latest.outputs.updated == 'true'
        env:
          SC2_BUILD_ID: "${{ steps.sc2_latest.outputs.build_id }}"
        run: python3 scripts/commit_gamedata_version.py --game sc2 --build "$SC2_BUILD_ID"

      - name: Check latest Heroes only (historical recovery disabled)
        if: inputs.game != 'sc2' && github.event_name == 'workflow_dispatch' && inputs.historical == false
        id: heroes_latest
        run: node scripts/update_hots_gamedata.js

      - name: Commit latest-only Heroes version
        if: steps.heroes_latest.outputs.updated == 'true'
        env:
          HOTS_BUILD_ID: "${{ steps.heroes_latest.outputs.build_id }}"
        run: python3 scripts/commit_gamedata_version.py --game heroes --build "$HOTS_BUILD_ID"

      - name: Push version commits and annotated tags to fork only
        if: github.event_name == 'schedule' || inputs.dry_run != true
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REPOSITORY" != "R-P-S/SC2GameData" ]]; then
            echo "Wrong repository; refusing to push." >&2
            exit 1
          fi
          if [[ "$(git rev-list --count origin/master..HEAD)" == "0" ]]; then
            echo "No new commits to push."
            exit 0
          fi
          # --follow-tags includes annotated, reachable tags from both new commits.
          # --atomic means failure to push any ref prevents publishing the others.
          git push --atomic --follow-tags origin "HEAD:refs/heads/master"
