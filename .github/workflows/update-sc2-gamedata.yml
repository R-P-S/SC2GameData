name: Update SC2 and Heroes Game Data
on:
  schedule:
    - cron: '17 14 * * 1-5'
      timezone: 'America/Denver'
  workflow_dispatch:
    inputs:
      game:
        description: "Which game to check"
        type: choice
        options: [both, sc2, heroes]
        default: both
      dry_run:
        description: "Extract and verify without changing repository files"
        type: boolean
        default: false
      force:
        description: "Re-extract even if the build ID matches"
        type: boolean
        default: false
      allow_history_gap:
        description: "EXPERIMENTAL: allow clearly documented missing old patches"
        type: boolean
        default: false
      historical:
        description: "EXPERIMENTAL: recover missed patches in chronological order"
        type: boolean
        default: false

permissions:
  contents: write
concurrency:
  group: sc2-and-heroes-gamedata-update
  cancel-in-progress: false
jobs:
  fetch:
    if: github.repository == 'R-P-S/SC2GameData' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      SC2_DRY_RUN: "${{ inputs.dry_run || 'false' }}"
      SC2_FORCE: "${{ inputs.force || 'false' }}"
      HOTS_DRY_RUN: "${{ inputs.dry_run || 'false' }}"
      HOTS_FORCE: "${{ inputs.force || 'false' }}"
    steps:
      - name: Checkout this fork
        uses: actions/checkout@v4
        with:
          repository: R-P-S/SC2GameData
          ref: master
          persist-credentials: true
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install CASC reader
        run: npm install --no-save --no-package-lock --no-audit --no-fund @jamiephan/casclib@0.3.0
      - name: Configure Git and safe fork remote
        run: |
          git config user.name "R-P-S GameData Bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://github.com/R-P-S/SC2GameData.git"

      # Always recover SC2 builds in order, including scheduled weekday runs.
      # Do not fall back to latest-only: that would silently skip patches.
      - name: Recover StarCraft II versions chronologically
        id: sc2_history
        if: inputs.game != 'heroes'
        shell: bash
        run: |
          set -euo pipefail
          EXTRA=""
          if [[ "$SC2_DRY_RUN" == "true" ]]; then EXTRA="$EXTRA --dry-run"; fi
          if [[ "$SC2_FORCE" == "true" ]]; then EXTRA="$EXTRA --force"; fi
          if [[ "${{ inputs.allow_history_gap }}" == "true" ]]; then EXTRA="$EXTRA --allow-gap"; fi
          python3 scripts/catch_up_history.py --game sc2 --max-builds 10 --history-scan 300 $EXTRA

      - name: Push SC2 updates independently
        if: inputs.game != 'heroes' && (github.event_name == 'schedule' || inputs.dry_run != true)
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REPOSITORY" != "R-P-S/SC2GameData" ]]; then exit 1; fi
          # Publish annotated tags even if no additional commit is needed.
          git push --atomic --follow-tags origin "HEAD:refs/heads/master"

      - name: Check Heroes history completion
        id: heroes_state
        if: inputs.game != 'sc2'
        shell: bash
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin refs/tags/heroes/history-complete >/dev/null 2>&1; then
            echo "complete=true" >> "$GITHUB_OUTPUT"
          else
            result=$?
            if [[ "$result" != "2" ]]; then exit "$result"; fi
            echo "complete=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Recover up to 10 historical Heroes versions
        id: heroes_history
        if: inputs.game != 'sc2' && (inputs.historical == true || steps.heroes_state.outputs.complete != 'true')
        shell: bash
        run: |
          set -euo pipefail
          EXTRA=""
          if [[ "$HOTS_DRY_RUN" == "true" ]]; then EXTRA="$EXTRA --dry-run"; fi
          if [[ "$HOTS_FORCE" == "true" ]]; then EXTRA="$EXTRA --force"; fi
          if [[ "${{ inputs.allow_history_gap }}" == "true" ]]; then EXTRA="$EXTRA --allow-gap"; fi
          python3 scripts/catch_up_history.py --game heroes --max-builds 10 --history-scan 300 $EXTRA

      - name: Mark Heroes archived history complete
        if: steps.heroes_history.outputs.caught_up == 'true' && inputs.dry_run != true
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REPOSITORY" != "R-P-S/SC2GameData" ]]; then exit 1; fi
          if ! git show-ref --verify --quiet refs/tags/heroes/history-complete; then
            git tag -a heroes/history-complete -m "Heroes historical archive catch-up complete"
          fi

      - name: Check latest Heroes after historical completion
        id: heroes_latest
        if: inputs.game != 'sc2' && inputs.historical != true && steps.heroes_state.outputs.complete == 'true'
        run: node scripts/update_hots_gamedata.js

      - name: Commit latest Heroes version
        if: steps.heroes_latest.outputs.updated == 'true'
        env:
          HOTS_BUILD_ID: "${{ steps.heroes_latest.outputs.build_id }}"
        run: python3 scripts/commit_gamedata_version.py --game heroes --build "$HOTS_BUILD_ID"

      - name: Push Heroes commits and tags only to this fork
        if: inputs.game != 'sc2' && (github.event_name == 'schedule' || inputs.dry_run != true)
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REPOSITORY" != "R-P-S/SC2GameData" ]]; then exit 1; fi
          # Publish annotated tags even if no additional commit is needed.
          git push --atomic --follow-tags origin "HEAD:refs/heads/master"
